name: Setup DB

on:
  workflow_dispatch:
    inputs:
      admin_password:
        description: 'Password for admin user'
        required: true
        type: string

jobs:
  setup:
    name: Run migrations + create admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - name: Run migrations
        working-directory: backend
        run: npx wrangler d1 execute messenger --remote --file=./migrations/0001_init.sql
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Create admin user
        working-directory: backend
        run: node scripts/create-admin.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
